---
name: 👷‍♂️ Build

on:
  workflow_dispatch:
    inputs:
      monthly:
        description: Monthly release (omit day from tag)
        type: boolean
        default: false

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    if: github.actor != 'renovate[bot]'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🧹 Lint
        uses: pre-commit/action@v3.0.1

  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint

    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📅 Generate date tag
        id: date
        run: |
          if [[ "${{ inputs.monthly }}" == "true" ]]; then
            echo "version=v$(date +'%Y.%m')" >> "$GITHUB_OUTPUT"
          else
            echo "version=v$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📃 Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.version }}

      - name: 🐳 Docker Build & Push
        uses: docker/build-push-action@v6
        id: docker_build
        env:
          DOCKER_BUILD_SUMMARY: true
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          secrets: |
            "GPG_KLOUDKIT_PRIVATE=${{ secrets.GPG_KLOUDKIT_PRIVATE }}"
          tags: ${{ steps.meta.outputs.tags }}

      - name: 📋 Extract manifest from image
        run: |
          docker pull --platform linux/amd64 ghcr.io/${{ github.repository }}:latest
          container_id=$(docker create ghcr.io/${{ github.repository }}:latest)
          docker cp "$container_id:/usr/share/nginx/html/manifest.json" manifest.json
          docker rm "$container_id"

      - name: 📝 Generate release body
        id: release_body
        run: |
          body=$(jq -r '
            "Built: \(.built)\n\n" +
            "| Name | Version | Architecture | Type | Link |\n" +
            "|------|---------|--------------|------|------|\n" +
            ([.packages[] |
              "| \(.name) | \(.version // "-") | \(.architecture // "-") | \(.type) | `\(.link)` |"
            ] | join("\n"))
          ' manifest.json)
          delimiter=$(openssl rand -hex 16)
          {
            echo "body<<${delimiter}"
            echo "$body"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: 🏷️ Create GitHub release
        run: |
          gh release delete "${{ steps.date.outputs.version }}" --yes 2>/dev/null || true
          gh release create "${{ steps.date.outputs.version }}" \
            --title "${{ steps.date.outputs.version }}" \
            --notes "${{ steps.release_body.outputs.body }}" \
            manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
